<title>Cena 05 — A casa viaja</title>
<style>
:root{--acc:#F07A3E;--ink:#EDE9E2;--mut:#9AA3AE;--bg:#0B0E12;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;left:0;right:0;height:7vh;background:#000;z-index:3}
.bar.t{top:0}.bar.b{bottom:0}
.title{position:fixed;inset:0;display:grid;place-items:center;z-index:4;pointer-events:none;opacity:0;transition:opacity .6s}
.title.on{opacity:1}
.title div{text-align:center}
.title .k{font-family:var(--mono);font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--acc)}
.title h1{font-family:var(--display);font-size:clamp(3rem,9vw,7rem);font-weight:700;line-height:.9;margin:12px 0 0;text-transform:uppercase;color:#fff;letter-spacing:.01em}
.sub{position:fixed;left:6vw;bottom:calc(7vh + 28px);z-index:4;max-width:44ch;pointer-events:none}
.sub .k{font-family:var(--mono);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);display:block;margin-bottom:6px}
.sub p{margin:0;font-family:var(--display);font-size:clamp(1.4rem,3.2vw,2.4rem);font-weight:600;line-height:1.05;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.6);opacity:0;transform:translateY(8px);transition:opacity .45s,transform .45s}
.sub p.on{opacity:1;transform:none}
.hud{position:fixed;right:6vw;bottom:calc(7vh + 28px);z-index:4;font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);text-align:right;line-height:1.8}
.hud b{display:block;font-family:var(--display);font-size:2.2rem;font-weight:600;color:#fff;letter-spacing:0;line-height:1;text-transform:none;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .4s}
.hud b.on{opacity:1}
.ctrl{position:fixed;left:0;right:0;bottom:0;height:7vh;z-index:5;display:flex;align-items:center;gap:14px;padding:0 6vw;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.ctrl button{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;font:inherit;padding:6px 10px;cursor:pointer;border-radius:2px}
.ctrl input{flex:1;accent-color:var(--acc)}
.grain{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");mix-blend-mode:overlay}
.vig{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
</style>
<canvas id="c"></canvas>
<div class="bar t"></div><div class="bar b"></div>
<div class="grain"></div><div class="vig"></div>
<div class="title on" id="title"><div><span class="k">Cena 05</span><h1>A casa<br>viaja</h1></div></div>
<div class="sub"><span class="k" id="subk">VEKS · celeiro B-36 offsite</span><p id="sub"></p></div>
<div class="hud"><b id="hudb"></b><span id="huds"></span></div>
<div class="ctrl"><button id="play">Pausar</button><input id="scrub" type="range" min="0" max="1000" value="0"><span id="tc">00:00</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var canvas=document.getElementById('c');

R.setPixelRatio(Math.min(devicePixelRatio,2)); R.shadowMap.enabled=true; R.shadowMap.type=THREE.PCFSoftShadowMap;
R.outputEncoding=THREE.sRGBEncoding; R.toneMapping=THREE.ACESFilmicToneMapping; R.toneMappingExposure=1.05;
var S=new THREE.Scene(); S.background=new THREE.Color(0xBFD3E6); S.fog=new THREE.Fog(0xBFD3E6,34,80);
var cam=new THREE.PerspectiveCamera(34,1,.1,200);
S.add(new THREE.HemisphereLight(0xE8F0FA,0x6B5A3E,.75));
var sun=new THREE.DirectionalLight(0xFFE9C9,2.1); sun.position.set(-14,22,10); sun.castShadow=true;

S.add(sun);
function mat(c,o){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85,metalness:0,flatShading:true},o||{}));}
var M={grass:mat(0x8FB36A),earth:mat(0x6E4F35),road:mat(0x4A4E52,{roughness:1}),wall:mat(0xF1ECE2,{roughness:.9}),win:mat(0x8FB6CF,{roughness:.2,metalness:.2}),
  wood:mat(0x8B5E3C),roof:mat(0x3A3E44,{roughness:1}),steel:mat(0x9AA6B2,{metalness:.5,roughness:.45}),truck:mat(0xE5E7EA),cab:mat(0xD9542B),tire:mat(0x1E2124,{roughness:1}),
  crane:mat(0xF2B233),craneD:mat(0xC7871B),leaf:mat(0x6E9A4E),leaf2:mat(0x5C8642),trunk:mat(0x7A5738),conc:mat(0xBFBBB2),cable:new THREE.LineBasicMaterial({color:0x222222})};

// ---- diorama ----
var base=box(30,1.2,24,M.earth,0,-.6,0); box(30,.06,24,M.grass,0,.03,0).receiveShadow=true;
box(4.2,.05,60,M.road,9,.04,0); for(var i=-28;i<30;i+=3) box(.12,.06,1.4,mat(0xEDEDEA),9,.07,i);
// árvores

[[-11,-8,1.3],[-12,4,1.1],[-8,9,1.0],[-4,-10,1.2],[4,-10.5,.9],[-13,-2,.9],[3,10,1.1],[-6,10.5,.8]].forEach(function(t){tree(t[0],t[1],t[2]);});
// fundação (pilaretes + chassi)
var PIL=.55,CH=.22; for(var i=0;i<3;i++){var z=-2.5+i*2.5;[-2.6,0,2.6].forEach(function(x){box(.24,PIL,.24,M.conc,x,PIL/2,z);});}
// ---- caixa (metade da casa) ----
function caixa(front){var g=new THREE.Group();var W=6,H=2.85,D=3;
  box(W,.22,D,M.steel,0,.11,0,g); box(W-.03,.05,D-.03,M.wood,0,.245,0,g);
  var wall=box(W,H,D,M.wall,0,.27+H/2,0,g); wall.geometry.translate(0,0,0);
  if(front){ // portão + janelas
    box(1.3,2.2,.08,M.wood,-1.55,.27+1.1,D/2+.05,g);box(1.3,2.2,.08,M.wood,1.55,.27+1.1,D/2+.05,g);box(2.6,.6,.08,M.wall,0,.27+2.5,D/2+.05,g);
    box(.05,2.0,.05,M.steel,-.9,.27+1.1,D/2+.05,g);box(.05,2.0,.05,M.steel,.9,.27+1.1,D/2+.05,g);
    box(2.55,2.05,.02,mat(0x2a2320),0,.27+1.05,D/2+.02,g);
  } else { box(1.2,1.0,.08,M.win,-1.6,.27+1.5,-D/2-.05,g); }
  box(.08,1.0,1.1,M.win,-W/2-.05,.27+1.4,0,g); box(.08,1.0,1.1,M.win,W/2+.05,.27+1.4,0,g);
  return g;}
var c1=caixa(true), c2=caixa(false); S.add(c1); S.add(c2);
// telhado (gambrel em painéis)
var XQ=1.68,HQ=(3-XQ)*Math.tan(Math.PI/3),HH=HQ+XQ*Math.tan(Math.PI/6);
function agua(x0,y0,x1,y1,g){var dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy);var m=new THREE.Mesh(new THREE.BoxGeometry(6.6,.16,L),M.roof);m.castShadow=true;m.receiveShadow=true;m.position.set(0,(y0+y1)/2,(x0+x1)/2);m.rotation.x=-Math.atan2(dy,dx);g.add(m);return m;}
// nota: telhado orientado com águas ao longo de z (frontões nas faces das caixas), então x↔z trocados
var roof=new THREE.Group(); var panels=[];
[-1,1].forEach(function(s){panels.push(agua(s*3.3,0,s*XQ,HQ,roof));panels.push(agua(s*XQ,HQ,0,HH,roof));});
var shp=new THREE.Shape();shp.moveTo(-3,0);shp.lineTo(-XQ,HQ);shp.lineTo(0,HH);shp.lineTo(XQ,HQ);shp.lineTo(3,0);shp.closePath();
[-1,1].forEach(function(s){var f=new THREE.Mesh(new THREE.ExtrudeGeometry(shp,{depth:.1,bevelEnabled:false}),M.wall);f.rotation.y=Math.PI/2;f.position.set(s*2.95,0,0);f.castShadow=true;roof.add(f);});
S.add(roof);
// ---- caminhão ----
var truck=new THREE.Group(); S.add(truck);
box(7.4,.5,2.6,M.truck,-.6,1.05,0,truck); box(2.0,2.2,2.5,M.cab,3.9,1.9,0,truck); box(1.9,.9,2.3,M.win,3.95,2.7,0,truck);
[[-3.2,-1.2],[-3.2,1.2],[-1.6,-1.2],[-1.6,1.2],[3.5,-1.2],[3.5,1.2]].forEach(function(w){cyl(.55,.5,M.tire,w[0],.55,w[1],truck,Math.PI/2);});
truck.rotation.y=Math.PI/2; // anda no eixo z
// ---- guindaste ----
var crane=new THREE.Group(); crane.position.set(5.5,0,-6.5); S.add(crane);
box(4.6,.9,2.4,M.crane,0,.95,0,crane); [[-1.5,-1.3],[-1.5,1.3],[1.5,-1.3],[1.5,1.3]].forEach(function(w){cyl(.6,.6,M.tire,w[0],.6,w[1],crane,Math.PI/2);});
[[-2.2,-1.5],[-2.2,1.5],[2.2,-1.5],[2.2,1.5]].forEach(function(o){box(.3,.3,1.3,M.craneD,o[0],.55,o[1]*0.8,crane);cyl(.12,.7,M.steel,o[0],.35,o[1]*1.2,crane);});
var turret=new THREE.Group(); turret.position.set(-.6,1.4,0); crane.add(turret);
box(2.4,.9,1.9,M.craneD,0,.45,0,turret); box(1.2,1.1,1.4,M.crane,-1.2,.55,.9,turret);
var boomPivot=new THREE.Group(); boomPivot.position.set(.6,.8,0); turret.add(boomPivot);
var L=11.5; var boom=box(L,.5,.5,M.crane,L/2,0,0,boomPivot); box(L*.5,.36,.36,M.craneD,L*.9,0,0,boomPivot);
var tip=new THREE.Object3D(); tip.position.set(L,0,0); boomPivot.add(tip);
var cableGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]); var cable=new THREE.Line(cableGeo,M.cable); S.add(cable);
var hook=box(.5,.35,.5,M.craneD,0,0,0); var spreader=box(6.2,.14,.14,M.craneD,0,0,0); spreader.visible=false;
// ---- timeline ----
var DUR=26;
function ease(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);}
function seg(t,a,b){return ease((t-a)/(b-a));}
function lerp(a,b,t){return a+(b-a)*t;}
var craneTargets={truck:new THREE.Vector3(9,0,0),site1:new THREE.Vector3(0,0,1.5),site2:new THREE.Vector3(0,0,-1.5)};
var cur=new THREE.Vector3(9,0,0); // alvo horizontal da lança
function aimBoom(target){ // gira torre e inclina lança para que a ponta fique sobre o alvo
  var wp=new THREE.Vector3(); boomPivot.getWorldPosition(wp);
  var dx=target.x-wp.x, dz=target.z-wp.z, d=Math.hypot(dx,dz); var yaw=Math.atan2(-dz,dx);
  turret.rotation.y=yaw; var el=Math.acos(Math.min(.98,d/L)); boomPivot.rotation.z=el;}
var tipW=new THREE.Vector3();
function liftPath(t,t0,t1,box,from,toXZ,restY){ // t0..t1: sobe, translada, desce
  var a=seg(t,t0,t0+(t1-t0)*.3), b=seg(t,t0+(t1-t0)*.3,t0+(t1-t0)*.7), c=seg(t,t0+(t1-t0)*.7,t1);
  var x=lerp(from.x,toXZ.x,b), z=lerp(from.z,toXZ.z,b);
  var y=lerp(from.y,7.2,a); y=lerp(y,restY,c);
  box.position.set(x,y,z); cur.set(x,0,z); return {x:x,y:y,z:z,att:true};}
var CAM=[ [0,[20,10,22],[1,2,0]],[6,[16,7,14],[4,2,0]],[9.5,[14,9.5,13],[3,4.5,0]],[12,[10.5,6,10],[1,3,.5]],[16,[13,8,-11],[1,2.5,0]],[19,[15,9.5,-10],[1,4.5,0]],[21.5,[11,6.5,9.5],[0,3.5,0]],[26,[14,6.5,13],[0,3,0]] ];
function camAt(t){var i=0;while(i<CAM.length-2&&t>CAM[i+1][0])i++;var a=CAM[i],b=CAM[i+1],f=ease((t-a[0])/(b[0]-a[0]));
  cam.position.set(lerp(a[1][0],b[1][0],f),lerp(a[1][1],b[1][1],f),lerp(a[1][2],b[1][2],f));cam.lookAt(lerp(a[2][0],b[2][0],f),lerp(a[2][1],b[2][1],f),lerp(a[2][2],b[2][2],f));}
var SUBS=[[3,"Caixa 1 chega. Três metros de largura — sem escolta.","",""],[8.5,"Guindaste da classe certa: 3,8 t por caixa.","3,8 t","por caixa"],[13.5,"A segunda viagem. A face de junção viaja fechada.","4,12 m","altura no transporte · limite 4,40"],[17.5,"Vão livre de seis metros: a viga, não o pilar.","6,00 m","vão livre na junção"],[20.5,"O telhado chega em painéis. Terceira viagem.","3","viagens"],[23.5,"Uma casa que sai pronta da fábrica.","59,5 m²","com sótão"]];
var subEl=document.getElementById('sub'),hudb=document.getElementById('hudb'),huds=document.getElementById('huds'),title=document.getElementById('title'),tc=document.getElementById('tc'),scrub=document.getElementById('scrub');
var lastSub=-1;
function apply(t){
  title.classList.toggle('on',t<2.4);
  // caminhão: viagem 1 (entra 1.5→6), sai (11.8→13.2), volta (13.2→15), sai (20→21.5)
  var tz;
  if(t<6) tz=lerp(-30,0,seg(t,1.5,6)); else if(t<11.8) tz=0; else if(t<13.2) tz=lerp(0,30,seg(t,11.8,13.2)); else if(t<15) tz=lerp(-30,0,seg(t,13.2,15)); else if(t<20) tz=0; else tz=lerp(0,30,seg(t,20,21.5));
  truck.position.set(9,0,tz);
  // caixas
  var onTruck1=t<7.2, onTruck2=t>=13.2&&t<16.2;
  var r1={att:false}, r2={att:false};
  if(onTruck1){c1.position.set(9,1.3,tz-.6);}
  else if(t<12){r1=liftPath(t,7.2,11.6,c1,new THREE.Vector3(9,1.3,-.6),craneTargets.site1,PIL);}
  else c1.position.set(0,PIL,1.5);
  if(t<13.2){c2.visible=false;} else {c2.visible=true;
    if(onTruck2){c2.position.set(9,1.3,tz-.6);}
    else if(t<20.6){r2=liftPath(t,16.2,20.4,c2,new THREE.Vector3(9,1.3,-.6),craneTargets.site2,PIL);}
    else c2.position.set(0,PIL,-1.5);}
  // telhado: desce 20.6→23.2
  var rt=seg(t,20.6,23.2); roof.visible=t>20.2; roof.position.set(0,PIL+.27+2.85+ (1-rt)*7,0);
  // lança: aponta para caixa em içamento, senão descansa apontando ao caminhão
  var att=r1.att||r2.att; var target=att?cur:(t<7.2?craneTargets.truck:(t<13.2?craneTargets.site1:craneTargets.truck));
  if(t>20.4&&t<23.4){target=new THREE.Vector3(0,0,0);}
  aimBoom(target);
  tip.getWorldPosition(tipW);
  var hookY=att?( (r1.att?c1:c2).position.y+3.4 ):(t>20.4&&t<23.4?roof.position.y+HH+.3:tipW.y-2.2);
  hook.position.set(tipW.x,hookY,tipW.z); hook.visible=true;
  cableGeo.setFromPoints([tipW,new THREE.Vector3(tipW.x,hookY+.18,tipW.z)]); cableGeo.attributes.position.needsUpdate=true;
  camAt(t);
  // legendas
  var si=-1; for(var i=0;i<SUBS.length;i++) if(t>=SUBS[i][0]) si=i;
  if(si!==lastSub){lastSub=si; if(si<0){subEl.classList.remove('on');hudb.classList.remove('on');} else {subEl.textContent=SUBS[si][1];subEl.classList.add('on');hudb.textContent=SUBS[si][2];huds.textContent=SUBS[si][3];hudb.classList.toggle('on',!!SUBS[si][2]);}}
  tc.textContent='00:'+(t<10?'0':'')+Math.floor(t); scrub.value=Math.round(t/DUR*1000);
  R.render(S,cam);
}
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
addEventListener('resize',resize); resize();
var t=0,playing=true,last=performance.now();
var playBtn=document.getElementById('play');
playBtn.onclick=function(){playing=!playing;playBtn.textContent=playing?'Pausar':'Reproduzir';last=performance.now();};
scrub.oninput=function(){t=scrub.value/1000*DUR;playing=false;playBtn.textContent='Reproduzir';apply(t);};
function loop(now){if(playing){t+=Math.min(.05,(now-last)/1000);if(t>DUR){t=0;lastSub=-1;}}last=now;apply(t);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
