<script type="module">
// Caso SIGE na obra dos galpões: a obra (dois galpões de Light Steel Frame numa fazenda, 11 baias cada, terra vermelha
// como nas fotos) e o escritório de obra, onde o notebook mostra o portal do cliente real (44,7% concluído).
// t: 0,6 → 2,8 os três últimos painéis do galpão B sobem (verticalização, como nas fotos); a câmera desce da vista
// aérea (t=0) ao escritório (t=4 e 7) e termina de frente para a tela (t=10), com a tela exatamente em RETANGULO.
// O canteiro em volta: pilhas de painéis em kit sobre calços, montantes soltos, pátio de materiais (betoneira, areia,
// brita, carrinho, baldes, tambores), vala cercada com fita zebrada, caixa d'água elevada, gerador com cabo, banheiro
// químico, contêiner, caçamba, caminhonete, caminhão de painéis na porteira, cerca de arame, estrada, moitas, árvores e
// gado ao longe; e o escritório com cadeira, capacete, garrafa térmica, quadro de cortiça e o cabo do notebook.
import {THREE, criarPalco, material, arvore as arvoreKit, vidro, documento, trajeto, enquadrarPlano, publicar, rampa} from './kit.js';

const palco = criarPalco({ceu: 0xD9E2EA, nevoa: [140, 340]});
const {cena, camera, sol} = palco;
sol.position.set(-40, 60, 30);
const S = {galpoes: [], divisorias: [], paineisSubindo: [], tela: null, quadros: []};
window.__cena = S;
// gerador com semente: as variações (posições, giros, tamanhos) são as mesmas em qualquer sessão (render quadro a quadro)
let sem = 7;
const rnd = () => (sem = (sem * 16807) % 2147483647) / 2147483647;
const entre = (a, b) => a + (b - a) * rnd();

// materiais locais (tipos que não existem no kit): pintura branca dos veículos, borracha dos pneus, plástico azul dos
// reservatórios, amarelo de segurança, areia, cortiça, água da poça (espelho escuro do céu) e a fita zebrada
const LOCAL = {
  pinturaBranca: new THREE.MeshStandardMaterial({color: 0xE9EAE6, roughness: .35, metalness: .25, envMapIntensity: 1.2}),
  borracha: new THREE.MeshStandardMaterial({color: 0x1E1F21, roughness: .9}),
  azul: new THREE.MeshStandardMaterial({color: 0x2F62A8, roughness: .55}),
  azulEscuro: new THREE.MeshStandardMaterial({color: 0x2A3F5E, roughness: .6, metalness: .3}),
  amarelo: new THREE.MeshStandardMaterial({color: 0xE3B72B, roughness: .55}),
  verdeMaquina: new THREE.MeshStandardMaterial({color: 0x4C5B4A, roughness: .6, metalness: .3}),
  // areia e brita: a cor própria com o relevo (mapa de normais) do solo do kit, que já tem grãos e pedriscos
  areia: new THREE.MeshStandardMaterial({color: 0xC9B98F, roughness: 1, normalMap: material('solo').normalMap, normalScale: new THREE.Vector2(1.5, 1.5)}),
  brita: new THREE.MeshStandardMaterial({color: 0x7E7B76, roughness: 1, normalMap: material('solo').normalMap, normalScale: new THREE.Vector2(3, 3)}),
  cortica: new THREE.MeshStandardMaterial({color: 0xB88A5A, roughness: .95}),
  pvc: new THREE.MeshStandardMaterial({color: 0xE8E4D8, roughness: .5}),
  agua: new THREE.MeshPhysicalMaterial({color: 0x5C4A3A, roughness: .04, metalness: 0, envMapIntensity: 1.6, clearcoat: 1, clearcoatRoughness: .03}),
  couro: new THREE.MeshStandardMaterial({color: 0xCFCBC2, roughness: .85}),  // o pelo cinza-claro do gado nelore
};
LOCAL.zebra = (() => {  // listras diagonais amarelas e pretas (sem letras), periódicas ao longo da fita
  const c = document.createElement('canvas'); c.width = 128; c.height = 16;
  const g = c.getContext('2d'); g.fillStyle = '#E3B72B'; g.fillRect(0, 0, 128, 16);
  g.fillStyle = '#1A1A1A';
  for (let x = -16; x < 144; x += 32) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 16, 0); g.lineTo(x + 32, 16); g.lineTo(x + 16, 16); g.closePath(); g.fill(); }
  const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; tx.wrapS = THREE.RepeatWrapping;
  return new THREE.MeshStandardMaterial({map: tx, roughness: .7, side: THREE.DoubleSide});
})();

function perfil(c, a, p, x, y, z, pai, mat = material('aco')) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(c, a, p), mat);
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; pai.add(m); return m;
}
function cilindro(r, h, x, y, z, pai, mat, r2 = r, seg = 16) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r2, h, seg), mat);
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; pai.add(m); return m;
}
// painel de Light Steel Frame: guias em cima e embaixo, montantes a cada 40 cm, bloqueador no meio (como nas fotos)
function pecasLSF(compr, alt) {
  const pecas = [[compr, .09, .09, compr / 2, .045, 0], [compr, .09, .09, compr / 2, alt - .045, 0], [compr, .04, .09, compr / 2, alt * .5, 0]];
  const n = Math.round(compr / .4);
  for (let i = 0; i <= n; i++) pecas.push([.04, alt - .18, .09, Math.min(i * .4, compr - .02), alt / 2, 0]);
  return pecas;
}
function painelLSF(compr, alt, pai) {
  const g = new THREE.Group(); pai.add(g);
  pecasLSF(compr, alt).forEach(p => perfil(...p, g));
  return g;
}
// repetições num só InstancedMesh: `lista` de [matriz] ou de {p, s, r} (posição, escala, giro em Euler)
function instancias(geo, mat, lista, pai = cena) {
  const m = new THREE.InstancedMesh(geo, mat, lista.length), M = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  lista.forEach((o, i) => {
    if (o.isMatrix4) M.copy(o);
    else { e.set(...(o.r || [0, 0, 0])); q.setFromEuler(e); M.compose(new THREE.Vector3(...o.p), q, new THREE.Vector3(...(o.s || [1, 1, 1]))); }
    m.setMatrixAt(i, M);
  });
  m.castShadow = m.receiveShadow = true; pai.add(m); return m;
}
// UV em coordenadas do mundo (x, z) / escala: o ladrilho do material fica do mesmo tamanho em qualquer geometria
function uvMundo(mesh, escala) {
  mesh.updateMatrixWorld(true);
  const pos = mesh.geometry.attributes.position, uv = mesh.geometry.attributes.uv, v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) { v.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld); uv.setXY(i, v.x / escala, v.z / escala); }
  uv.needsUpdate = true;
}
const arvores = [];
function arvore(x, z, s) { const g = arvoreKit(s); g.position.set(x, 0, z); g.rotation.y = rnd() * 6.28; cena.add(g); arvores.push(g); }

// terreno: pasto em quatro faixas em volta da praça (a praça tem relevo e desce nas valas e poças, por isso o pasto
// não pode passar por baixo dela), a praça da obra em terra vermelha com montes, vala e poças, a estrada até a porteira
const PX = 48, PZ0 = -24, PZ1 = 32;  // a praça: x ∈ [-48, 48], z ∈ [-24, 32]
function faixaPasto(x0, x1, z0, z1) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, z1 - z0), material('pasto', {repetir: 1}));
  m.rotation.x = -Math.PI / 2; m.position.set((x0 + x1) / 2, 0, (z0 + z1) / 2); m.receiveShadow = true; cena.add(m); uvMundo(m, 10);
}
faixaPasto(-300, 300, -300, PZ0); faixaPasto(-300, 300, PZ1, 300); faixaPasto(-300, -PX, PZ0, PZ1); faixaPasto(PX, 300, PZ0, PZ1);
// relevo da praça: gaussianas (montes +, vala e poças −), zero sob os galpões e o escritório
const GALPOES = [[-20, 0], [20, 0]], COMPR = 33, LARG = 9;
const gauss = (x, z, cx, cz, sx, sz) => Math.exp(-((x - cx) ** 2 / (sx * sx) + (z - cz) ** 2 / (sz * sz)));
const POCAS = [[-14, 9, 1.8, 1.3], [16, 24, 1.9, 1.4], [-24, 20, 1.6, 1.6], [28, 27, 2.1, 1.1], [-3, 26, 1.4, 1.0], [6, 6.5, 1.2, .9]];  // cx, cz, σx, σz
const MONTES = [[-13, 11, 2.6, 2.2, 1.3], [31, 14, 2.2, 1.8, .9], [12.8, 10.5, 1.5, 5.0, .45]];  // o último: a terra tirada da vala
const VALA = {x: 9.6, z0: 6, z1: 15, larg: 1.2, prof: .85};
function relevo(x, z) {
  for (const g of GALPOES) if (Math.abs(x - g[0]) < COMPR / 2 + 1.5 && Math.abs(z - g[1]) < LARG / 2 + 1.5) return 0;
  if (Math.abs(x) < 3.5 && z > 16.5 && z < 23.5) return 0;
  let h = 0;
  for (const m of MONTES) h += m[4] * gauss(x, z, m[0], m[1], m[2], m[3]);
  for (const p of POCAS) h -= .12 * gauss(x, z, p[0], p[1], p[2], p[3]) * (1 + .3 * Math.sin(2.1 * x + 1.3 * z) * Math.cos(1.7 * z - .8 * x));
  const dz = Math.max(0, Math.max(VALA.z0 - z, z - VALA.z1)), dx = Math.abs(x - VALA.x);
  const d = Math.hypot(Math.max(0, dx - VALA.larg / 2), dz);
  h -= VALA.prof * Math.max(0, 1 - d / .5);
  const borda = Math.min(1, (PX - Math.abs(x)) / 3, (z - PZ0) / 3, (PZ1 - z) / 3);
  return h * Math.max(0, borda);
}
// a malha da praça: irregular, fina na faixa da vala (30 cm em x, 50 cm em z), de 1 m no resto; já em coordenadas do mundo
function amostras(a, b, fina, passo) {
  const v = [];
  for (let x = a; x <= b + 1e-6; x += 1) v.push(x);
  for (let x = fina[0]; x <= fina[1] + 1e-6; x += passo) v.push(x);
  return [...new Set(v.map(x => Math.round(x * 100) / 100))].sort((a, b) => a - b);
}
const pracaGeo = (() => {
  const xs = amostras(-PX, PX, [7, 15.5], .3), zs = amostras(PZ0, PZ1, [4, 17], .5);
  const nx = xs.length, nz = zs.length, pos = [], uv = [], idx = [];
  zs.forEach(z => xs.forEach(x => { pos.push(x, relevo(x, z), z); uv.push(x / 7, z / 7); }));
  for (let j = 0; j < nz - 1; j++) for (let i = 0; i < nx - 1; i++) {
    const a = j * nx + i, b = a + 1, c = a + nx, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
})();
const praca = new THREE.Mesh(pracaGeo, material('solo', {repetir: 1}));
praca.position.y = .02; praca.castShadow = praca.receiveShadow = true; cena.add(praca);
// as poças: um espelho baixo dentro de cada depressão; a linha d'água é onde o chão cruza o plano (contorno irregular)
POCAS.forEach(p => {
  const a = new THREE.Mesh(new THREE.CircleGeometry(1.35 * Math.max(p[2], p[3]), 28), LOCAL.agua);
  a.rotation.x = -Math.PI / 2; a.position.set(p[0], .02 - .04, p[1]); a.receiveShadow = true; cena.add(a);
});
// a estrada de terra: da porteira (x = 30, z = 36) para fora da fazenda
const estrada = new THREE.Mesh(new THREE.PlaneGeometry(7, 130), material('solo', {repetir: 1}));
estrada.rotation.x = -Math.PI / 2; estrada.position.set(30, .01, 31 + 65); estrada.receiveShadow = true; cena.add(estrada); uvMundo(estrada, 7);

// os dois galpões: piso de concreto, parede do fundo em painéis de LSF de 3 m, 11 divisórias de baia; o A já tem os pilares da cobertura
const N_BAIAS = 11, H_PAINEL = 2.2, H_PILAR = 4.8;
function galpao(x0, comPilares) {
  const G = new THREE.Group(); G.position.set(x0, 0, 0); cena.add(G);
  const piso = new THREE.Mesh(new THREE.BoxGeometry(COMPR, .18, LARG), material('concreto', {repetir: 6}));
  piso.position.y = .09; piso.castShadow = piso.receiveShadow = true; G.add(piso);
  const fundo = [];
  for (let i = 0; i < COMPR / 3; i++) { const p = painelLSF(3, H_PAINEL, G); p.position.set(-COMPR / 2 + i * 3, .18, -LARG / 2 + .1); fundo.push(p); }
  const passo = COMPR / N_BAIAS;
  for (let k = 0; k < N_BAIAS; k++) {
    const d = painelLSF(3.6, H_PAINEL * .8, G); d.rotation.y = -Math.PI / 2;
    d.position.set(-COMPR / 2 + (k + .5) * passo, .18, -LARG / 2 + .15); S.divisorias.push(d);
  }
  if (comPilares) for (let k = 0; k <= N_BAIAS; k += 2)
    [-LARG / 2 + .3, LARG / 2 - .3].forEach(z => perfil(.25, H_PILAR, .25, -COMPR / 2 + k * passo, .18 + H_PILAR / 2, z, G, material('acoPintado')));
  S.galpoes.push(G);
  return fundo;
}
galpao(-20, true);
const fundoB = galpao(20, false);
S.paineisSubindo = fundoB.slice(-3); // os três últimos painéis do B ainda sobem (verticalização)
S.assunto = S.galpoes;

// ---- o canteiro ----------------------------------------------------------------------------------------------------
// pilhas de perfis e os cones que marcam o caminho até o escritório (o acento da cena)
for (let i = 0; i < 6; i++) perfil(6, .09, .09, 0, .05 + i * .1, 9 + (i % 2) * .12, cena);
for (let i = 0; i < 8; i++) { const f = perfil(6, .09, .09, 41 + (i % 2) * .12, .05 + Math.floor(i / 2) * .1, 6 + (i % 2) * .5, cena); f.rotation.y = Math.PI / 2 + .15; }
const cone = material('acento');
[[2, 10.5], [3.2, 12.5], [4.4, 14.5], [5.6, 16.5], [-2.2, 14.8], [8.2, 22.5], [-6.2, 27.5]].forEach(p => {
  const c = new THREE.Mesh(new THREE.ConeGeometry(.22, .7, 16), cone); c.position.set(p[0], .37, p[1]); c.rotation.y = rnd(); c.castShadow = true; cena.add(c);
  const base = perfil(.5, .03, .5, p[0], .015, p[1], cena, LOCAL.borracha); base.rotation.y = c.rotation.y;
});

// painéis em kit deitados sobre calços de madeira (pilhas perto de cada galpão), os do caminhão, e os montantes soltos:
// todas as peças de aço num só InstancedMesh; os calços e paletes noutro (madeira)
const aco = [], madeira = [], tmpM = new THREE.Matrix4(), tmpT = new THREE.Matrix4(), tmpS = new THREE.Matrix4();
function painelDeitado(base, compr, alt) {  // `base`: matriz do canto do painel deitado (x ao longo, z na antiga altura, y para cima)
  pecasLSF(compr, alt).forEach(p => {
    tmpT.makeTranslation(p[3], p[5], p[4]); tmpS.makeScale(p[0], p[2], p[1]);
    aco.push(new THREE.Matrix4().copy(base).multiply(tmpT).multiply(tmpS));
  });
}
function pilhaPaineis(x, z, ang, n, compr = 3, alt = H_PAINEL) {
  const R = new THREE.Matrix4().makeRotationY(ang), T = new THREE.Matrix4();
  for (let k = 0; k < 3; k++) {  // três calços atravessados
    T.makeTranslation(x, .05, z); tmpM.copy(T).multiply(R).multiply(tmpT.makeTranslation(compr * (.15 + .35 * k), 0, alt / 2)).multiply(tmpS.makeScale(.1, .1, alt + .3));
    madeira.push(tmpM.clone());
  }
  for (let i = 0; i < n; i++) {
    T.makeTranslation(x, .1 + i * .1, z);
    const base = new THREE.Matrix4().copy(T).multiply(R).multiply(tmpT.makeTranslation(entre(-.03, .03), 0, entre(-.03, .03)));
    painelDeitado(base, compr, alt);
  }
}
pilhaPaineis(23.5, 7.5, .06, 6); pilhaPaineis(28.5, 7.8, -.05, 4); pilhaPaineis(33.5, 8, .1, 5, 3.6, H_PAINEL * .8);
pilhaPaineis(-27, 7.6, .04, 5); pilhaPaineis(-33, 7.9, -.08, 3, 3.6, H_PAINEL * .8);
for (let i = 0; i < 14; i++) {  // montantes soltos no chão perto da pilha do galpão B
  const x = entre(18.5, 22), z = entre(6.5, 9.5), a = entre(-.35, .35);
  aco.push(new THREE.Matrix4().compose(new THREE.Vector3(x, .045 + (i % 3) * .09, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, a, 0)), new THREE.Vector3(3, .09, .04)));
}
// paletes de madeira empilhados (pátio) e o feixe de telhas metálicas do galpão A
function palete(x, y, z, ang) {
  const R = new THREE.Matrix4().makeRotationY(ang), T = new THREE.Matrix4().makeTranslation(x, y, z);
  [[-.5, .04, 0, .1, .08, 1.0], [0, .04, 0, .1, .08, 1.0], [.5, .04, 0, .1, .08, 1.0]].forEach(b => madeira.push(new THREE.Matrix4().copy(T).multiply(R).multiply(tmpT.makeTranslation(b[0], b[1], b[2])).multiply(tmpS.makeScale(b[3], b[4], b[5]))));
  for (let k = 0; k < 5; k++) madeira.push(new THREE.Matrix4().copy(T).multiply(R).multiply(tmpT.makeTranslation(0, .1, -.45 + k * .225)).multiply(tmpS.makeScale(1.2, .03, .1)));
}
for (let k = 0; k < 6; k++) palete(-31, .13 * k, 12.5, entre(-.06, .06));
for (let k = 0; k < 3; k++) palete(-29.4, .13 * k, 12.6, entre(-.06, .06));
for (let k = 0; k < 8; k++) { const t = perfil(6, .015, 1.05, -30 + entre(-.03, .03), .12 + k * .02, 15.5 + entre(-.02, .02), cena, material('telha')); t.rotation.y = entre(-.01, .01); }
madeira.push(new THREE.Matrix4().compose(new THREE.Vector3(-32, .06, 15.5), new THREE.Quaternion(), new THREE.Vector3(.1, .1, 1.2)),
             new THREE.Matrix4().compose(new THREE.Vector3(-28, .06, 15.5), new THREE.Quaternion(), new THREE.Vector3(.1, .1, 1.2)));
// escada de alumínio encostada num pilar do galpão A
{
  const alt = 4.6, inc = .32, x = -6.5, z0 = 4.2 + alt * Math.sin(inc);
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(-inc, 0, 0));
  [-.22, .22].forEach(dx => aco.push(new THREE.Matrix4().compose(new THREE.Vector3(x + dx, alt / 2 * Math.cos(inc), z0 - alt / 2 * Math.sin(inc)), q, new THREE.Vector3(.04, alt, .08))));
  for (let k = 1; k < 15; k++) { const s = k * .3; aco.push(new THREE.Matrix4().compose(new THREE.Vector3(x, s * Math.cos(inc), z0 - s * Math.sin(inc)), q, new THREE.Vector3(.44, .03, .03))); }
}
// pátio de materiais (entre o galpão A e o escritório): areia, brita, betoneira, carrinho de mão, baldes, tambores
function monte(x, z, r, h, mat) {
  const geo = new THREE.IcosahedronGeometry(1, 3), pos = geo.attributes.position;
  for (let k = 0; k < pos.count; k++) {
    const x = pos.getX(k), y = pos.getY(k), z = pos.getZ(k);
    const f = 1 + .07 * Math.sin(5.3 * x + 2.1 * z) * Math.cos(4.7 * z - 1.3 * y) + .05 * Math.sin(11 * x * z + 3 * y);
    pos.setXYZ(k, x * f, Math.max(-.05, y) * f, z * f);
  }
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, mat); m.scale.set(r, h, r * .85); m.position.set(x, .02, z); m.rotation.y = rnd() * 6; m.castShadow = m.receiveShadow = true; cena.add(m); return m;
}
monte(-6.6, 9.8, 1.7, 1.0, LOCAL.areia); monte(-9.6, 8.6, 1.4, .8, LOCAL.brita); monte(35, 20, 2.2, 1.1, LOCAL.brita);
{ // betoneira: tambor inclinado sobre o chassi de duas rodas, motor ao lado
  const b = new THREE.Group(); b.position.set(-4.2, 0, 12.6); b.rotation.y = -.5; cena.add(b);
  perfil(1.1, .08, .08, 0, .45, 0, b, material('acoPintado')); perfil(.08, .08, 1.0, 0, .45, 0, b, material('acoPintado'));
  [[-.55, .35], [.55, .35]].forEach(w => { const r = cilindro(.22, .1, w[0], .22, -.25, b, LOCAL.borracha); r.rotation.z = Math.PI / 2; });
  [[-.5, 0], [.5, 0]].forEach(p => perfil(.06, .9, .06, p[0], .9, .2, b, material('acoPintado')));
  const tambor = new THREE.Group(); tambor.position.set(0, 1.25, .2); tambor.rotation.x = -.6; b.add(tambor);
  cilindro(.42, .45, 0, 0, 0, tambor, LOCAL.amarelo, .3); cilindro(.26, .35, 0, .38, 0, tambor, LOCAL.amarelo, .42);
  cilindro(.33, .1, 0, 0, 0, b, material('acoPintado')).position.set(.4, .2, .35);
  perfil(.4, .3, .35, .4, .3, .35, b, material('acoPintado'));
}
{ // carrinho de mão: caçamba de chapa, roda dianteira, duas pernas e os cabos
  const c = new THREE.Group(); c.position.set(-3.2, 0, 15); c.rotation.y = 2.2; cena.add(c);
  const cac = perfil(.6, .3, .8, 0, .45, 0, c, material('acoPintado')); cac.rotation.x = .1;
  const r = cilindro(.18, .06, 0, .18, .55, c, LOCAL.borracha); r.rotation.z = Math.PI / 2;
  [-.25, .25].forEach(x => { perfil(.03, .03, 1.5, x, .35, -.1, c, material('acoPintado')); perfil(.03, .3, .03, x, .15, -.5, c, material('acoPintado')); });

  perfil(.24, .012, .33, .55, .78, -1.0, E, material('plastico'));  // a prancheta
  cilindro(.14, .45, -1.9, .35, -1.4, E, LOCAL.azul, .12, 16); cilindro(.05, .1, -1.9, .62, -1.4, E, LOCAL.azul, .05, 12);  // galão de água
  perfil(.5, .38, .36, -1.4, .31, -1.45, E, LOCAL.azul); perfil(.52, .05, .38, -1.4, .52, -1.45, E, LOCAL.pvc);  // caixa térmica
  [[-2.15, -.3], [-1.95, -.25]].forEach(p => { perfil(.11, .1, .3, p[0], .17, p[1], E, LOCAL.borracha); cilindro(.055, .25, p[0], .3, p[1] - .08, E, LOCAL.borracha, .05, 10); });  // as botas
}

// câmera: vista aérea dos dois galpões → escritório → de frente para a tela (última chave calculada: tela exatamente em RETANGULO)

publicar(palco, cam, t => {
