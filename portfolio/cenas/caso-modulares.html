<script type="module">
// Caso 4, o celeiro B-36 em duas caixas de 3,00 × 6,00 m: a caixa 2 já está na fundação e o kit do telhado (2 frontões
// e 4 águas, da terceira viagem) espera empilhado no chão; o caminhão chega com a caixa 1 (t 0,3 → 2,2), o guindaste a
// iça e pousa ao lado (2,4 → 4,8) e depois monta o telhado gambrel peça a peça, da pilha para o lugar (5,0 → 7,4),
// tudo com a câmera ainda na obra: ela só parte para o cavalete em t ≈ 7,7 (o `trajeto` suaviza o tempo: a chave 8,6 cai aí).
// No cavalete ao lado da obra, a prancha real "como cada caixa viaja": a câmera termina de frente para ela (t=10).
// Geometria adaptada de ref/cena5.html (o padrão aprovado), com os materiais do kit.
import {THREE, criarPalco, material, vidro, arvore, documento, trajeto, enquadrarPlano, publicar, rampa, lerp, suave, limitar} from './kit.js';

const palco = criarPalco({ceu: 0xD9E2EA, nevoa: [120, 320]});
const {cena, camera, sol} = palco;
sol.position.set(-40, 60, 30);
const S = {caixas: [], caminhao: null, guindaste: {}, telhado: null, pecas: [], prancha: null, alvo: null, assunto: [], docs: [], repouso: {}};
window.__cena = S;
const PIL = .55;  // altura dos pilaretes da fundação

function bloco(c, a, p, x, y, z, pai, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(c, a, p), mat);
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; pai.add(m); return m;
}
function cilindro(r, h, x, y, z, pai, mat, deitado = false) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 20), mat);
  if (deitado) m.rotation.x = Math.PI / 2;
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; pai.add(m); return m;
}
function real(textura, mesh, nome) { textura.then(tx => { mesh.material.map = tx; mesh.material.needsUpdate = true; }); S.docs.push(nome); return mesh; }

// terreno: pasto, a praça de terra e a estrada de asfalto (x = 12, ao longo de z)
// o pasto tem um recorte sob a praça (senão o capim atravessa o chão onde os sulcos e o relevo descem); as UVs da
// ShapeGeometry vêm em metros: repetir .1 = um ladrilho a cada 10 m, o mesmo que o plano de 600 m com 60 repetições
const formaPasto = new THREE.Shape(); formaPasto.moveTo(-300, -300); formaPasto.lineTo(300, -300); formaPasto.lineTo(300, 300); formaPasto.lineTo(-300, 300); formaPasto.closePath();
const furo = new THREE.Path(); furo.moveTo(-18.7, -16.7); furo.lineTo(-18.7, 12.7); furo.lineTo(20.7, 12.7); furo.lineTo(20.7, -16.7); furo.closePath(); formaPasto.holes.push(furo);
const pasto = new THREE.Mesh(new THREE.ShapeGeometry(formaPasto, 1), material('pasto', {repetir: .1}));
pasto.rotation.x = -Math.PI / 2; pasto.receiveShadow = true; cena.add(pasto);
// a praça de terra (x -19..21, z -13..17) tem relevo de verdade na malha: ondulação suave, um monte de terra e os sulcos
// dos pneus dos caminhões que entraram pela estrada; fica plana onde há coisas assentadas (fundação, pilha, cavaletes,
// guindaste, sob o asfalto) e nas bordas. `chao(x, z)` dá a altura do chão para pousar cada objeto novo.
let semente = 11;  // gerador com semente fixa: o render é quadro a quadro em sessões diferentes (nada de Math.random)
const rnd = () => (semente = (semente * 16807) % 2147483647) / 2147483647;
const entre = (a, b) => a + (b - a) * rnd();
const GRADE = []; for (let i = 0; i < 64 * 64; i++) GRADE.push(rnd());
const vg = (a, b) => GRADE[((b % 64 + 64) % 64) * 64 + ((a % 64 + 64) % 64)];
const ruido2 = (x, y) => { const ix = Math.floor(x), iy = Math.floor(y), fx = suave(x - ix), fy = suave(y - iy);
  return lerp(lerp(vg(ix, iy), vg(ix + 1, iy), fx), lerp(vg(ix, iy + 1), vg(ix + 1, iy + 1), fx), fy); };
const PLANOS = [[-4.2, 4.2, -4.2, 4.2], [1.4, 9.6, 2.4, 7.2], [8.4, 15.6, -16, 20], [8, 11, 7.6, 10.6], [.8, 3, 8.4, 10.4], [2.6, 8.6, -9.4, -3.6]];  // x0, x1, z0, z1
const MONTES = [[-8, -10.4, 2.3, 1.4], [18.4, 4, 1.6, .7]];  // x, z, raio, altura
const TRILHAS = [[[8.8, 12.6], [3.4, 8.3], [-3, 5.4], [-8.5, 2.2], [-12.5, -2.5]], [[8.8, -11.6], [2, -10.3], [-3.5, -9.4], [-7.4, -8.4]]];
function distSeg(x, z, a, b) {
  const dx = b[0] - a[0], dz = b[1] - a[1], u = limitar(((x - a[0]) * dx + (z - a[1]) * dz) / (dx * dx + dz * dz));
  return Math.hypot(x - a[0] - u * dx, z - a[1] - u * dz);
}
function relevo(x, z) {
  let m = suave(Math.min(x + 19, 21 - x, z + 13, 17 - z) / 1.5);
  for (const r of PLANOS) m = Math.min(m, suave(Math.hypot(Math.max(r[0] - x, 0, x - r[1]), Math.max(r[2] - z, 0, z - r[3])) / .9));
  let y = m * ((ruido2(x / 3.2 + 11, z / 3.2 + 5) - .5) * .07 + (ruido2(x / .9 + 3, z / .9 + 9) - .5) * .02);
  for (const md of MONTES) y += md[3] * Math.pow(Math.max(0, 1 - (((x - md[0]) ** 2 + (z - md[1]) ** 2) / (md[2] * md[2]))), 1.5);
  for (const tr of TRILHAS) {
    let d = 1e9;
    for (let i = 0; i + 1 < tr.length; i++) d = Math.min(d, distSeg(x, z, tr[i], tr[i + 1]));
    const g = Math.abs(d - .85);  // duas rodeiras a 1,70 m uma da outra, com uma leve borda levantada
    if (g < .45) y -= .09 * suave(1 - g / .45) * m; else if (g < .8) y += .02 * Math.sin(Math.PI * (g - .45) / .35) * m;
  }
  return y;
}
const chao = (x, z) => (x > -19 && x < 21 && z > -13 && z < 17) ? .02 + relevo(x, z) : 0;
const geoPraca = new THREE.PlaneGeometry(40, 30, 120, 90), pp = geoPraca.attributes.position;
for (let i = 0; i < pp.count; i++) pp.setZ(i, relevo(pp.getX(i) + 1, 2 - pp.getY(i)));
geoPraca.computeVertexNormals();
const praca = new THREE.Mesh(geoPraca, material('solo', {repetir: 8}));
praca.rotation.x = -Math.PI / 2; praca.position.set(1, .02, 2); praca.receiveShadow = praca.castShadow = true; cena.add(praca);
const estrada = new THREE.Mesh(new THREE.PlaneGeometry(6, 160), material('asfalto', {repetir: 10}));
estrada.rotation.x = -Math.PI / 2; estrada.position.set(12, .03, 0); estrada.receiveShadow = true; cena.add(estrada);
[[-60, -35, 1.5], [-48, 22, 1.2], [44, -40, 1.4], [55, 25, 1.3], [-30, 50, 1.1], [30, 48, 1.2], [-17.5, -20, 1.4], [24, -24, 1.25]].forEach(a => { const g = arvore(a[2]); g.position.set(a[0], 0, a[1]); cena.add(g); });

// fundação: 9 pilaretes de concreto (3 × 3) sob as duas caixas
for (const x of [-2.6, 0, 2.6]) for (const z of [-2.5, 0, 2.5]) bloco(.24, PIL, .24, x, PIL / 2, z, cena, material('concreto'));

// uma caixa do celeiro: 6,00 (x) × 3,00 (z) × 2,85 m, chassi de aço, piso, paredes com montantes aparentes na face de
// junção, portão e janelas na frente; a de trás (caixa 2) já está na fundação, a da frente (caixa 1) chega no caminhão
function caixa(frente) {
  const g = new THREE.Group(), W = 6, H = 2.85, D = 3;
  bloco(W, .22, D, 0, .11, 0, g, material('aco'));
  bloco(W - .04, .05, D - .04, 0, .245, 0, g, material('madeira', {repetir: 3}));
  bloco(W, H, D, 0, .27 + H / 2, 0, g, material('papel'));
  [[-W / 2, 0], [W / 2, 0]].forEach(c => bloco(.08, H + .05, .08, c[0], .27 + H / 2, frente ? D / 2 : -D / 2, g, material('aco')));
  const zj = frente ? -D / 2 - .03 : D / 2 + .03;  // a face de junção: montantes a cada 40 cm, como saem da fábrica
  for (let i = 0; i <= 15; i++) bloco(.04, H - .1, .05, -W / 2 + .02 + i * .4, .27 + H / 2, zj, g, material('aco'));
  if (frente) {
    bloco(1.3, 2.2, .06, -1.55, .27 + 1.1, D / 2 + .04, g, material('madeira'));
    bloco(1.3, 2.2, .06, 1.55, .27 + 1.1, D / 2 + .04, g, material('madeira'));
    bloco(2.55, 2.05, .02, 0, .27 + 1.05, D / 2 + .02, g, vidro());
  } else {
    bloco(1.2, 1.0, .06, -1.6, .27 + 1.5, -D / 2 - .04, g, vidro());
  }
  bloco(.06, 1.0, 1.1, -W / 2 - .04, .27 + 1.4, 0, g, vidro());
  bloco(.06, 1.0, 1.1, W / 2 + .04, .27 + 1.4, 0, g, vidro());
  cena.add(g); S.caixas.push(g); return g;
}
const caixa1 = caixa(true), caixa2 = caixa(false);
caixa2.position.set(0, PIL, -1.5);
S.repouso.caixa1 = [0, PIL, 1.5];

// o telhado gambrel em kit (águas ao longo de z, frontões em x = ±2,95): o grupo fica parado sobre as duas caixas e cada
// peça guarda dois poses locais, `ini` (deitada na pilha do kit, no chão ao lado da fundação) e `fim` (montada)
const XQ = 1.68, HQ = (3 - XQ) * Math.tan(Math.PI / 3), HH = HQ + XQ * Math.tan(Math.PI / 6);
S.telhado = new THREE.Group(); cena.add(S.telhado);
S.repouso.telhado = PIL + .27 + 2.85;
S.telhado.position.y = S.repouso.telhado;
function agua(z0, y0, z1, y1) {
  const L = Math.hypot(z1 - z0, y1 - y0), m = bloco(6.6, .16, L, 0, (y0 + y1) / 2, (z0 + z1) / 2, S.telhado, material('telha'));
  m.rotation.x = -Math.atan2(y1 - y0, z1 - z0); return m;
}
const frontao = new THREE.Shape();
frontao.moveTo(-3, 0); frontao.lineTo(-XQ, HQ); frontao.lineTo(0, HH); frontao.lineTo(XQ, HQ); frontao.lineTo(3, 0); frontao.closePath();
function pecaFrontao(s) {
  const f = new THREE.Mesh(new THREE.ExtrudeGeometry(frontao, {depth: .1, bevelEnabled: false}), material('papel'));
  f.rotation.y = Math.PI / 2; f.position.set(s * 2.95, 0, 0); f.castShadow = f.receiveShadow = true; S.telhado.add(f); return f;
}
// ordem de montagem: os dois frontões, as duas águas de baixo, as duas de cima; a pilha tem a primeira peça em cima
S.pecas = [pecaFrontao(-1), pecaFrontao(1), agua(-3.3, 0, -XQ, HQ), agua(3.3, 0, XQ, HQ), agua(-XQ, HQ, 0, HH), agua(XQ, HQ, 0, HH)];
const PILHA = new THREE.Vector3(5.5, .02 - S.repouso.telhado, 4.6);  // local ao grupo: no chão, entre a fundação e a estrada, ao alcance da lança
S.pecas.forEach((p, k) => {
  const fim = {p: p.position.clone(), q: p.quaternion.clone()};
  const deitada = k < 2 ? new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0)) : new THREE.Quaternion();
  const ini = {p: new THREE.Vector3(PILHA.x, PILHA.y + .08 + (5 - k) * .18, PILHA.z + (k < 2 ? HH / 2 : 0)), q: deitada};
  p.userData = {ini, fim, montada: false};
  p.position.copy(ini.p); p.quaternion.copy(ini.q);
});

// o caminhão (carreta comum): chassi, cabine, rodas; anda no eixo z sobre a estrada, cabine para +z
S.caminhao = new THREE.Group(); S.caminhao.position.set(12, 0, -40); cena.add(S.caminhao);
bloco(2.6, .5, 7.4, 0, 1.05, -.6, S.caminhao, material('acoPintado'));
bloco(2.5, 2.2, 2.0, 0, 1.9, 3.9, S.caminhao, material('acoPintado'));
bloco(2.3, .9, 1.9, 0, 2.7, 3.95, S.caminhao, vidro());
[[-1.2, -3.2], [1.2, -3.2], [-1.2, -1.6], [1.2, -1.6], [-1.2, 3.5], [1.2, 3.5]].forEach(w => { const r = cilindro(.55, .5, w[0], .55, w[1], S.caminhao, material('plastico')); r.rotation.set(0, 0, Math.PI / 2); });

// o guindaste: base sobre rodas com patolas, torre que gira, lança que inclina, cabo, gancho e balancim (o acento)
const G = S.guindaste;
G.base = new THREE.Group(); G.base.position.set(5.5, 0, -6.5); cena.add(G.base);
bloco(4.6, .9, 2.4, 0, .95, 0, G.base, material('acoPintado'));
[[-1.5, -1.3], [-1.5, 1.3], [1.5, -1.3], [1.5, 1.3]].forEach(w => { const r = cilindro(.6, .6, w[0], .6, w[1], G.base, material('plastico')); r.rotation.set(0, 0, Math.PI / 2); });
[[-2.2, -1.5], [-2.2, 1.5], [2.2, -1.5], [2.2, 1.5]].forEach(o => { bloco(.3, .3, 1.3, o[0], .55, o[1] * .8, G.base, material('aco')); cilindro(.12, .7, o[0], .35, o[1] * 1.2, G.base, material('aco')); });
G.torre = new THREE.Group(); G.torre.position.set(-.6, 1.4, 0); G.base.add(G.torre);
bloco(2.4, .9, 1.9, 0, .45, 0, G.torre, material('acoPintado'));
bloco(1.2, 1.1, 1.4, -1.2, .55, .9, G.torre, vidro());
G.lanca = new THREE.Group(); G.lanca.position.set(.6, .8, 0); G.torre.add(G.lanca);
const L = 11.5;
bloco(L, .5, .5, L / 2, 0, 0, G.lanca, material('aco'));
bloco(L * .5, .36, .36, L * .9, 0, 0, G.lanca, material('aco'));
G.ponta = new THREE.Object3D(); G.ponta.position.set(L, 0, 0); G.lanca.add(G.ponta);
G.cabo = cilindro(.02, 1, 0, 0, 0, cena, material('aco'));
G.gancho = new THREE.Group(); cena.add(G.gancho);
bloco(.5, .35, .5, 0, 0, 0, G.gancho, material('acento'));
bloco(6.2, .14, .14, 0, -.5, 0, G.gancho, material('aco'));
const alvoLanca = new THREE.Vector3();
function apontar(x, z) { // gira a torre e inclina a lança para que a ponta fique sobre (x, z)
  G.base.updateMatrixWorld(true);
  const wp = G.lanca.getWorldPosition(new THREE.Vector3());
  const dx = x - wp.x, dz = z - wp.z, d = Math.hypot(dx, dz);
  G.torre.rotation.y = Math.atan2(-dz, dx);
  G.lanca.rotation.z = Math.acos(Math.min(.98, d / L));
  G.base.updateMatrixWorld(true);
}
S.assunto = [caixa2, G.base];

// o cavalete de obra com as pranchas reais: "como cada caixa viaja" (o alvo, 1,00 × 0,625 m), a prancha de transporte
// e a página 1 da ata das decisões, num quadro menor ao lado
const cavalete = new THREE.Group(); cavalete.position.set(9.5, 0, 9); cavalete.rotation.y = -.35; cena.add(cavalete);
[-.5, .5].forEach(x => { const p = bloco(.05, 1.8, .05, x, .9, 0, cavalete, material('madeira')); p.rotation.x = -.21; p.position.z = -.19; });
const quadro = bloco(1.1, .74, .02, 0, 1.15, 0, cavalete, material('madeira'));
quadro.rotation.x = -.21;
S.prancha = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 1.0 * 1443 / 2308), new THREE.MeshBasicMaterial({color: 0xffffff}));
S.prancha.position.set(0, 1.15, .012); S.prancha.rotation.x = -.21; cavalete.add(S.prancha);
S.alvo = real(documento('../site/docs/b36-caixas.webp'), S.prancha, 'b36-caixas.webp');
const lateral = new THREE.Group(); lateral.position.set(1.9, 0, 9.4); lateral.rotation.y = -.6; cena.add(lateral);
[-.35, .35].forEach(x => bloco(.05, 1.5, .05, x, .75, 0, lateral, material('madeira')));
bloco(.8, 1.2, .02, 0, .95, 0, lateral, material('madeira'));
const transporte = new THREE.Mesh(new THREE.PlaneGeometry(.7, .7 * 1069 / 1709), new THREE.MeshStandardMaterial({color: 0xffffff, roughness: .95}));
transporte.position.set(0, 1.3, .012); lateral.add(transporte); real(documento('../site/docs/b36-transporte.webp'), transporte, 'b36-transporte.webp');
const ata = new THREE.Mesh(new THREE.PlaneGeometry(.42, .42 * 2330 / 1650), new THREE.MeshStandardMaterial({color: 0xffffff, roughness: .95}));
ata.position.set(0, .72, .012); lateral.add(ata); real(documento('../site/docs/b36-ata.webp'), ata, 'b36-ata.webp');

// ---------- o canteiro ao redor: tapume, contêiner de canteiro, caixa d'água, materiais em paletes, betoneira, andaime,
// cones, picape, rede elétrica, cerca de arame da divisa, pedras e moitas no pasto. Tudo com semente fixa, geometria
// simples e fora do caminho da caixa 1, das peças do telhado (pilha → arco → telhado) e da câmera no fim (t ≥ 8,6,
// x 7..17 × z 9..16, e o eixo câmera → prancha). Nada fica entre a câmera e a caixa 2 ou o guindaste em t=0.
const MAT = {  // materiais locais (candidatos ao kit): zinco, azul, amarelo, areia, brita, saco, lona, borracha
  zinco: new THREE.MeshStandardMaterial({color: 0xC9CED2, roughness: .5, metalness: .3, envMapIntensity: 1.1}),
  azul: new THREE.MeshStandardMaterial({color: 0x2B5C8E, roughness: .55, metalness: .05}),
  amarelo: new THREE.MeshStandardMaterial({color: 0xD8A020, roughness: .5, metalness: .15}),
  areia: new THREE.MeshStandardMaterial({color: 0xC4AE86, roughness: 1}),
  brita: new THREE.MeshStandardMaterial({color: 0x86847E, roughness: 1}),
  saco: new THREE.MeshStandardMaterial({color: 0xC9B99E, roughness: .95}),
  lona: new THREE.MeshStandardMaterial({color: 0x3E6EA6, roughness: .7}),
  borracha: new THREE.MeshStandardMaterial({color: 0x1F2225, roughness: .9}),
};
function instancias(geo, mat, lista) {  // lista: [x, y, z, rotY, sx, sy, sz, rotX, rotZ]
  const m = new THREE.InstancedMesh(geo, mat, lista.length), M = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  lista.forEach((it, i) => { e.set(it[7] || 0, it[3] || 0, it[8] || 0); q.setFromEuler(e); M.compose(new THREE.Vector3(it[0], it[1], it[2]), q, new THREE.Vector3(it[4] ?? 1, it[5] ?? 1, it[6] ?? 1)); m.setMatrixAt(i, M); });
  m.castShadow = m.receiveShadow = true; cena.add(m); return m;
}
function grupo(x, z, ry = 0) { const g = new THREE.Group(); g.position.set(x, chao(x, z), z); g.rotation.y = ry; cena.add(g); return g; }

// tapume de chapa zincada (placas lisas de 2,20 × 2,00 m em postes) em três lados da praça, aberto para a estrada; um
// retorno curto na esquina norte junto à estrada. Cada placa com altura e prumo levemente diferentes.
const placas = [], postes = [];
function tapume(x0, z0, x1, z1) {
  const L = Math.hypot(x1 - x0, z1 - z0), n = Math.round(L / 2.2), w = L / n, ang = Math.atan2(-(z1 - z0), x1 - x0);
  for (let i = 0; i <= n; i++) { const f = i / n, x = lerp(x0, x1, f), z = lerp(z0, z1, f); postes.push([x, chao(x, z) + 1.15, z, ang, 1, 1, 1]); }
  for (let i = 0; i < n; i++) {
    const f = (i + .5) / n, x = lerp(x0, x1, f), z = lerp(z0, z1, f);
    placas.push([x, chao(x, z) + 1.06 + entre(-.03, .03), z, ang + entre(-.015, .015), w / 2.2, entre(.97, 1.03), 1, 0, entre(-.01, .01)]);
  }
}
tapume(-19, 17, -19, -13); tapume(-19, -13, 8.5, -13); tapume(-19, 17, 8.5, 17); tapume(8.5, -13, 8.5, -8.6);
instancias(new THREE.BoxGeometry(2.2, 2.0, .03), MAT.zinco, placas);
instancias(new THREE.BoxGeometry(.08, 2.3, .08), material('acoPintado'), postes);

// contêiner de canteiro (escritório/almoxarifado) sobre blocos, com porta, janela, frisos, ar-condicionado e degrau
{
  const g = grupo(-14.5, -10, .12);
  [[-2.6, -1], [2.6, -1], [-2.6, 1], [2.6, 1]].forEach(b => bloco(.4, .3, .4, b[0], .15, b[1], g, material('concreto')));
  bloco(6, 2.6, 2.6, 0, .3 + 1.3, 0, g, material('acoPintado'));
  bloco(6.1, .06, 2.7, 0, 2.93, 0, g, MAT.zinco);

  S.pecas.forEach((p, k) => {
