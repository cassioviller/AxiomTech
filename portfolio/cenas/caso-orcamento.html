<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Cena · Sistema de orçamento (VEKS)</title>
<link rel="icon" href="data:,"><!-- evita o pedido automático de /favicon.ico (viraria um "erro" de console falso) -->
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../site/vendor/three.module.js"}}</script>
</head><body>
<script type="module">
// Caso 2, o sistema de orçamento da VEKS: a estação de trabalho de um orçamentista. No monitor, a tela real do orçamento
// (a obra de demonstração do sistema); sobre a mesa, a planta que o sistema desenhou. t: 0,5 → 2,5 a cadeira gira para a
// mesa; a câmera sai da frente da sala (t=0), passa por trás da cadeira (t=4) e termina de frente para o monitor (t=10),
// com a tela exatamente em RETANGULO.
import {THREE, criarPalco, material, documento, trajeto, enquadrarPlano, publicar, rampa} from './kit.js';

const palco = criarPalco({ceu: 0xE3E7EA, nevoa: [40, 120]});
const {cena, camera, sol} = palco;
sol.position.set(-8, 10, 6);
Object.assign(sol.shadow.camera, {left: -8, right: 8, top: 8, bottom: -8});
sol.shadow.camera.updateProjectionMatrix();
const S = {mesa: null, monitor: null, tela: null, alvo: null, cadeira: null, estante: null, assunto: [], docs: []};
window.__cena = S;

function bloco(c, a, p, x, y, z, pai, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(c, a, p), mat);
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; pai.add(m); return m;
}
function real(textura, mesh, nome) { // textura de documento real num plano já criado
  textura.then(tx => { mesh.material.map = tx; mesh.material.needsUpdate = true; });
  S.docs.push(nome);
  return mesh;
}

// a sala 8 × 6 m: piso de madeira, parede do fundo com janela, parede lateral
const piso = new THREE.Mesh(new THREE.PlaneGeometry(8, 6), material('madeira', {repetir: 4}));
piso.rotation.x = -Math.PI / 2; piso.receiveShadow = true; cena.add(piso);
bloco(8, 3, .1, 0, 1.5, -3, cena, material('papel'));
bloco(.1, 3, 6, -4, 1.5, 0, cena, material('papel'));
const janela = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 1.2), new THREE.MeshBasicMaterial({color: 0xEAF0F6}));
janela.position.set(1.4, 1.6, -2.94); cena.add(janela);
[[.75, 0], [-.75, 0], [0, .55], [0, -.55]].forEach(p => bloco(p[1] ? 1.6 : .04, p[1] ? .04 : 1.2, .03, 1.4 + p[0], 1.6 + p[1], -2.93, cena, material('acoPintado')));

// a estante contra a parede do fundo, com pastas
S.estante = new THREE.Group(); S.estante.position.set(-2.3, 0, -2.7); cena.add(S.estante);
[0, .45, .9, 1.35].forEach(y => bloco(1.2, .03, .35, 0, y + .03, 0, S.estante, material('madeira')));
[-.6, .6].forEach(x => bloco(.03, 1.5, .35, x, .75, 0, S.estante, material('madeira')));
for (let i = 0; i < 12; i++) bloco(.07, .3, .28, -.5 + (i % 6) * .16, .21 + Math.floor(i / 6) * .45, .01, S.estante, i % 3 ? material('acoPintado') : material('plastico'));

// a mesa 1,8 × 0,8 m, tampo a 0,75 m, virada para +z (a câmera vem de +z)
S.mesa = new THREE.Group(); S.mesa.position.set(0, 0, -1.6); cena.add(S.mesa);
bloco(1.8, .04, .8, 0, .73, 0, S.mesa, material('madeira', {repetir: 2}));
[[-.85, -.35], [.85, -.35], [-.85, .35], [.85, .35]].forEach(p => bloco(.05, .71, .05, p[0], .355, p[1], S.mesa, material('acoPintado')));
bloco(.44, .015, .14, .05, .7575, .18, S.mesa, material('plastico'));   // teclado
bloco(.06, .03, .1, .4, .765, .2, S.mesa, material('plastico'));        // mouse

// o monitor: pé, painel 0,68 × 0,44 e a tela 0,64 × 0,40 (proporção 1,6, a do corte 1280×800) na face da frente
S.monitor = new THREE.Group(); S.monitor.position.set(0, .75, -.25); S.mesa.add(S.monitor);
bloco(.26, .02, .18, 0, .01, 0, S.monitor, material('acoPintado'));
bloco(.05, .34, .04, 0, .19, 0, S.monitor, material('acoPintado'));
bloco(.68, .44, .03, 0, .42, .03, S.monitor, material('plastico'));
S.tela = new THREE.Mesh(new THREE.PlaneGeometry(.64, .4), new THREE.MeshBasicMaterial({color: 0xffffff}));
S.tela.position.set(0, .42, .046); S.monitor.add(S.tela);
S.alvo = real(documento('../site/docs/veks-orcamento.webp'), S.tela, 'veks-orcamento.webp');

// a planta sobre a mesa (a que o sistema desenhou; 600×500) e o marca-texto laranja sobre ela (o acento da cena)
const planta = new THREE.Mesh(new THREE.PlaneGeometry(.36, .3), new THREE.MeshStandardMaterial({color: 0xffffff, roughness: .95}));
planta.rotation.set(-Math.PI / 2, 0, .12); planta.position.set(-.6, .752, .1); planta.receiveShadow = true; S.mesa.add(planta);
real(documento('../site/docs/veks-planta.webp'), planta, 'veks-planta.webp');
const marcador = new THREE.Mesh(new THREE.CylinderGeometry(.007, .007, .13, 12), material('acento'));
marcador.rotation.set(0, .6, Math.PI / 2); marcador.position.set(-.52, .76, .2); marcador.castShadow = true; S.mesa.add(marcador);

// a cadeira, de frente para a mesa depois de girar
S.cadeira = new THREE.Group(); S.cadeira.position.set(0, 0, -.8); cena.add(S.cadeira);
bloco(.5, .06, .5, 0, .46, 0, S.cadeira, material('plastico'));
bloco(.5, .55, .05, 0, .78, .24, S.cadeira, material('plastico'));
const coluna = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, .4, 12), material('acoPintado'));
coluna.position.y = .23; coluna.castShadow = true; S.cadeira.add(coluna);
for (let i = 0; i < 5; i++) { const b = bloco(.3, .03, .04, 0, .03, 0, S.cadeira, material('acoPintado')); b.rotation.y = i * Math.PI * 2 / 5; b.position.set(Math.sin(b.rotation.y) * .15, .03, Math.cos(b.rotation.y) * .15); }
S.assunto = [S.mesa, S.cadeira, S.estante];

// câmera: da frente da sala, alta, a 5,4 m (t=0: estante, mesa e cadeira inteiras) → atrás da cadeira (t=4) → aproximação (t=7) → de frente para a tela (t=10)
cena.updateMatrixWorld(true);
const centro = S.tela.getWorldPosition(new THREE.Vector3());
const normal = new THREE.Vector3(0, 0, 1).applyQuaternion(S.tela.getWorldQuaternion(new THREE.Quaternion()));
const fim = enquadrarPlano(camera, centro, normal, .64);
const aproximacao = centro.clone().addScaledVector(normal, 1.4).add(new THREE.Vector3(0, .15, 0));
const cam = trajeto([
  [0, [.06, 2.25, 2.96], [-1, .4, -2]],
  [4, [.9, 1.6, .5], [0, 1.1, -1.8]],
  [7, aproximacao.toArray(), centro.toArray()],
  [10, fim[0], fim[1]],
]);
publicar(palco, cam, t => { S.cadeira.rotation.y = .8 * (1 - rampa(t, .5, 2.5)); });
</script>
</body></html>
